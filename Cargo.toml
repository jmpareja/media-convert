[package]
name = "media-convert"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.31"
rfd = "0.15"

[[bin]]
name = "media-convert"
path = "src/main.rs"

[[bin]]
name = "media-convert-gui"
path = "src/bin/gui.rs"
